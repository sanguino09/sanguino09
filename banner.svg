<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Alejandro Sanguino — Desarrollo web y productos digitales">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .name { font: 800 64px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fff; letter-spacing: -1.5px; }
      .role { font: 600 22px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: url(#accent); letter-spacing: 0.5px; }
      .sub  { font: 500 16px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 3px; }
      .chip { font: 600 14px 'SFMono-Regular', Consolas, monospace; fill: #e2e8f0; }
      .rise { animation: rise 1s ease-out both; }
      .rise2 { animation: rise 1s .25s ease-out both; }
      .rise3 { animation: rise 1s .5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out -2s infinite; }
      .float3 { animation: float 8s ease-in-out -4s infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- flight path + plane -->
    <path id="route" d="M-40 270 C 250 300, 520 120, 760 150 S 1100 60, 1260 40" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <g>
      <g transform="scale(1.1) rotate(0)">
        <path d="M0 0 L-6 -3 L-28 -22 L-34 -22 L-24 -2 L-40 -2 L-46 -9 L-50 -9 L-46 0 L-50 9 L-46 9 L-40 2 L-24 2 L-34 22 L-28 22 L-6 3 Z" fill="#fff" opacity="0.95"/>
      </g>
      <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </g>

    <!-- floating code chips -->
    <g class="float" transform="translate(900 70)">
      <rect width="120" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text class="chip" x="60" y="24" text-anchor="middle">&lt;html /&gt;</text>
    </g>
    <g class="float2" transform="translate(1010 150)">
      <rect width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text class="chip" x="65" y="24" text-anchor="middle">{ react }</text>
    </g>
    <g class="float3" transform="translate(870 220)">
      <rect width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text class="chip" x="65" y="24" text-anchor="middle">py &gt; ./run</text>
    </g>
    <circle class="pulse" cx="1130" cy="70" r="5" fill="#22d3ee"/>
    <circle class="pulse" cx="840" cy="150" r="4" fill="#a78bfa" style="animation-delay:.8s"/>
    <circle class="pulse" cx="1150" cy="250" r="3" fill="#fff" style="animation-delay:1.4s"/>

    <!-- text -->
    <text class="sub rise" x="70" y="96">HOLA, SOY</text>
    <text class="name rise2" x="68" y="160">Alejandro Sanguino</text>
    <text class="role rise3" x="70" y="204">Desarrollo web &amp; productos digitales</text>
    <text class="sub rise3" x="70" y="250" style="font-size:14px; letter-spacing:1.5px">INGENIERO AERONÁUTICO  ·  ANALISTA FUNCIONAL  ·  FUNDADOR DE KOMBATLY</text>
    <rect x="70" y="270" width="140" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
